<html>
    <head>
        <script defer type="module" src="index.mjs"></script>
        <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    </head>

    <body>
        <header class="homey-header">
            <h1 class="homey-title" data-i18n="settings.title"></h1>
            <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
        </header>

        <fieldset class="homey-form-fieldset">
            <legend class="homey-form-legend">Zonneplan login</legend>

            <div class="homey-form-group">
                <label class="homey-form-label" for="email">E-mail</label>
                <input class="homey-form-input" id="email" type="email" value="" />
            </div>

            <div class="homey-form-group">
                <label class="homey-form-label" for="installation">
                    Installation name
                </label>
                <input
                    class="homey-form-input"
                    id="installation"
                    type="text"
                    maxlength="100"
                    placeholder="Homey"
                />
            </div>

            <div class="homey-form-group">
                <label class="homey-form-label" for="otp">
                    Verification code
                </label>
                <input
                    class="homey-form-input"
                    id="otp"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    disabled
                />
            </div>
        </fieldset>

        <button
            id="requestCode"
            class="homey-button-primary"
        >
            Send verification code
        </button>

        <button
            id="login"
            class="homey-button-primary"
            disabled="disabled"
        >
            Login
        </button>
    </body>
</html>
